<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetravox</title>
    <style>
      /* The host's page shows through an iframe with a transparent body for the split second before
         the first paint, and `#root` is sized by the shell's own flex layout, not by the document. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #16181c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
