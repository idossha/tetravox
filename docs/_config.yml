# Tetravox GitHub Pages Configuration
title: Tetravox
author: Ido Haber
email: ihaber@wisc.edu
baseurl: "/tetravox" # Your repository name
url: "https://idossha.github.io" # Your GitHub Pages URL

# Plugins (no theme gem — layouts/includes below are authored directly)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation (top nav; matched against site.pages by source path)
header_pages:
  - install.md
  - USER_GUIDE.md
  - AUTOMATION.md
  - gallery.md
  - TESTING.md
  - ARCHITECTURE.md
  - DECISIONS.md
  - ROADMAP.md
  - BENCHMARKS.md

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude files/dirs that should not be built as pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/
  - requirements/
  - media/walkthrough.manifest.json
  - link_check.py
