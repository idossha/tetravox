[package]
name = "tvx-wasm"
description = "wasm-bindgen bindings (handle-based) for the Tetravox compute worker (ARCHITECTURE.md §6.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Every §6.3 call site lives in `src/geom.rs` behind this feature. It was added because calling a
# Phase-0 `unimplemented!()` from wasm traps the module rather than returning an error (§5 rule 8),
# which would have taken the whole mesh half of the protocol down with it.
#
# **ON since the Phase-1 integration** — `tvx-geom` and `tvx-core` both have real bodies now, so the
# geometry ops call `tvx_geom::*` one-to-one. The switch is kept rather than deleted so that
# `--no-default-features` still builds a module with the geometry ops answering
# `Error::Unsupported`, which is what `packages/wasm/e2e/geometry.spec.ts` probes at runtime.
[features]
default = ["geom"]
geom = []

[dependencies]
tvx-core.workspace = true
tvx-nifti.workspace = true
tvx-mesh-io.workspace = true
tvx-geom.workspace = true
# Pinned EXACTLY (§2): wasm-pack's version is pinned in scripts/build-wasm.sh to match.
wasm-bindgen.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
