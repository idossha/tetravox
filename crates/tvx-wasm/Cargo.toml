[package]
name = "tvx-wasm"
description = "wasm-bindgen bindings (handle-based) for the Tetravox compute worker (ARCHITECTURE.md §6.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# `tvx-geom` (§6.3) is still the Phase-0 `unimplemented!()` stub, and calling one of those from wasm
# traps the module instead of returning an error (§5 rule 8). Every §6.3 call site therefore lives in
# `src/geom.rs` behind this feature: off, the geometry ops answer `Error::Unsupported` and the module
# stays alive; on, they are `tvx_geom::*` one-to-one.
#
# THE INTEGRATOR FLIPS `default = ["geom"]` IN THE COMMIT THAT LANDS A REAL `tvx-geom`.
# `cargo clippy --workspace --all-targets --features geom` keeps the enabled arm compiling meanwhile.
# Turning it on also requires a real `tvx-core` — `BitMask` is a stub too, and `mesh_isolate` counts
# its bits.
[features]
default = []
geom = []

[dependencies]
tvx-core.workspace = true
tvx-nifti.workspace = true
tvx-mesh-io.workspace = true
tvx-geom.workspace = true
# Pinned EXACTLY (§2): wasm-pack's version is pinned in scripts/build-wasm.sh to match.
wasm-bindgen.workspace = true
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
