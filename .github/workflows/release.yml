# Tetravox release — ARCHITECTURE.md §12.1's `package` matrix, on a tag.
#
# The shape is TI-Toolbox's `release-build.yml`, which this project's maintainer runs elsewhere:
#
#   create-release  →  one job per OS, each uploading its own artefacts to that release
#                   →  verify, which fails if an expected asset is missing
#
# Creating the Release first (rather than collecting everything and creating it at the end) means a
# slow leg does not hold the fast ones hostage: each platform attaches its assets as soon as it has
# them, and a leg that fails leaves the others already attached. The cost is that the Release object
# exists before it is complete, which is exactly why it is created as a **draft** and why `verify`
# exists.
#
# ONE DELIBERATE DEVIATION from the reference workflow: `draft: true`. The reference publishes
# immediately; here nothing is public until a human has looked at the assets and pressed Publish
# (docs/RELEASING.md §3). A draft missing a `.dmg` is a fixable morning; a published one is not.
#
# `workflow_dispatch` builds the same matrix without touching any Release: `create-release` and every
# upload step are `if:`-gated on `refs/tags/`, so a dispatch still produces downloadable workflow
# artefacts and proves the matrix.
#
# The repository is public, so Actions minutes are free and the 10x macOS cost policy that shapes
# `ci.yml`'s matrix does not apply here (DECISIONS 2026-08-27 is about a private repo).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Release and attach assets

env:
  CARGO_TERM_COLOR: always
  # Same pin as ci.yml — wasm-pack's version is pinned in scripts/build-wasm.sh and wasm-bindgen is
  # `=0.2.127` in Cargo.toml. A mismatch produces glue that does not match the module (§12.3).
  WASM_PACK_VERSION: '0.15.0'

jobs:
  # ------------------------------------------------------------------------------------------------
  # 1. The Release object, before anything is built
  # ------------------------------------------------------------------------------------------------
  create-release:
    name: Create the draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # `generate_release_notes` diffs against the previous tag

      - name: Version and notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # node rather than awk/sed: the CHANGELOG heading contains `[` and `]` and the body contains
          # backticks and `$`. A heredoc-delimited multi-line value is the only way to pass it on.
          node scripts/changelog-section.mjs "$version" > /tmp/notes.md
          {
            echo 'body<<TETRAVOX_EOF'
            cat /tmp/notes.md
            echo 'TETRAVOX_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tetravox ${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.body }}
          generate_release_notes: true
          draft: true
          prerelease: false

  # ------------------------------------------------------------------------------------------------
  # 1b. `@tetravox/module-sdk` — the tarball a module repository pins by URL (§13.8).
  #
  # Its own job, and a cheap one: `node scripts/emit-module-sdk.mjs` needs an install and nothing
  # else — no Rust, no wasm, no electron — because the SDK is declarations plus a forty-line shim.
  # Emitting it beside the platform legs rather than inside one of them means the tarball is
  # attached even when a platform leg is still running, and that a module author's dependency does
  # not depend on which runner was slow.
  #
  # There is NO npm publishing here, deliberately: an SDK belongs to exactly one core release, and a
  # release URL says which. `verify` below requires the asset, so a Release cannot be published
  # without it.
  # ------------------------------------------------------------------------------------------------
  sdk:
    name: Module SDK
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      asset: ${{ steps.emit.outputs.asset }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-ubuntu-24.04-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The script is three gates — every staged import resolves inside the SDK, the shim has no
      # imports at all, and the emitted package typechecks against a probe that imports it the way a
      # module does — so a failure here is a failure to produce a *usable* SDK, not just a missing
      # file.
      - name: Emit the SDK
        id: emit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/emit-module-sdk.mjs
          asset="$(basename "$(ls dist/module-sdk/*.tgz)")"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "emitted $asset"

      - name: Upload the workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: tetravox-module-sdk
          path: dist/module-sdk/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/module-sdk/*.tgz
          fail_on_unmatched_files: true

  # ------------------------------------------------------------------------------------------------
  # 2. One job per OS/arch: build, smoke-test, upload a workflow artefact, attach to the Release.
  # ------------------------------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: create-release
    # `always()` plus the explicit check, so a `workflow_dispatch` run — where `create-release` is
    # skipped rather than successful — still builds the matrix. A *tagged* run whose Release could not
    # be created stops here instead of building four artefacts with nowhere to put them.
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows is optional; see the matrix comment. A failure there must not fail the workflow.
    continue-on-error: ${{ matrix.required == 'no' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: ONE runner for BOTH slices, and that is not a shortcut — it is the stronger test.
          # `electron-builder.yml` declares `arch: [arm64, x64]`, so this leg emits all six mac assets
          # whatever the `--mac` line asks for; the v0.2.0 draft was in fact filled entirely by the
          # arm64 leg while the Intel one was still failing. What the Intel runner added was a smoke
          # claim it could not make: `macos-26-intel` has no Metal device, and macOS has no working
          # software fallback either — ANGLE there allows only `metal` and `swiftshader`, and
          # SwiftShader's Vulkan backend fails to initialise (`Internal Vulkan error (-3)`,
          # reproduced identically on an M2 Mac against eight flag combinations). So the x64 slice is
          # smoke-tested HERE, under Rosetta 2, on the arm64 runner's real GPU — measured at 14 s for
          # the smoke job on an M2 (against 3 s native), which is nothing next to a leg that cannot
          # render at all. `--all` is what runs both.
          - name: macOS arm64 + x64 (dmg + zip)
            os: macos-latest
            builder: --mac
            smoke: --all
            required: 'yes'
            artefacts: |
              packages/app/release/*.dmg
              packages/app/release/*.zip
              packages/app/release/*.blockmap
          # Linux hosted runners have no GPU: the GPU process dies during initialisation under Xvfb
          # and the renderer then reports `vertex shader failed to compile: (no log)` from a context
          # that is already gone. `--software-gl` names ANGLE's SwiftShader backend explicitly rather
          # than hoping for a fallback (`src/main/index.ts` §2), and the smoke test then *asserts*
          # that the renderer it got really was a software one.
          - name: Linux x64 (AppImage + deb + tar.gz)
            os: ubuntu-24.04
            builder: --linux --x64
            smoke: --software-gl
            required: 'yes'
            artefacts: |
              packages/app/release/*.AppImage
              packages/app/release/*.deb
              packages/app/release/*.tar.gz
          # Windows is OPTIONAL. macOS and Linux are the priority platforms; this leg is here only
          # because it costs nothing to keep — `electron-builder --win --x64` on a stock
          # `windows-latest` downloads its own NSIS and produces an unsigned installer with no extra
          # tooling: no wine, no Visual Studio, no certificate. `continue-on-error` plus
          # `required: no` mean a Windows failure never blocks a macOS/Linux release; `verify` reports
          # it as an absence instead of failing on it.
          - name: Windows x64 (nsis, optional)
            os: windows-latest
            builder: --win --x64
            smoke: --version-only
            required: 'no'
            artefacts: |
              packages/app/release/*.exe
              packages/app/release/*.blockmap

    steps:
      - uses: actions/checkout@v5

      # §12.2: pin the electron download cache to one path on every runner — macOS would otherwise put
      # it under ~/Library/Caches. Not in `env:`, which is not shell-expanded.
      - name: Pin the download cache to the §12.2 path
        shell: bash
        run: echo "ELECTRON_CACHE=$HOME/.cache/electron" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ matrix.os }}-

      - name: Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.os }}-

      - name: Install wasm-pack ${{ env.WASM_PACK_VERSION }} (pinned by scripts/build-wasm.sh)
        shell: bash
        run: |
          if [ "$(wasm-pack --version 2>/dev/null | awk '{print $2}')" != "$WASM_PACK_VERSION" ]; then
            cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked --force
          fi
          wasm-pack --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # §13.8: the modules `modules.lock` bundles, downloaded from their own repositories' releases
      # and sha256-verified into `packages/app/resources/modules/` — which `electron-builder.yml`
      # already ships as `extraResources`, so no packaging configuration changes. A hash that does
      # not match fails the leg here, before anything is built: an unverified module must never
      # reach a packaged app. The layout is defined in the script's header, and it is a no-op while
      # the lock is empty.
      - name: Bundle the locked modules
        shell: bash
        run: node scripts/fetch-locked-modules.mjs

      # The Linux smoke test launches the packaged binary, so this leg needs the same runtime
      # libraries and display the `test` job provides. `libasound2t64` is the 24.04 name — the
      # 64-bit-time_t rename makes an unqualified `libasound2` unsatisfiable there.
      - name: Linux runtime deps + Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libgtk-3-0 libnss3 libasound2t64
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Xvfb never came up on :99" >&2
          exit 1

      - name: pnpm wasm
        run: pnpm wasm

      - name: Icons must be present (never ship the stock Electron logo)
        shell: bash
        run: bash scripts/ensure-icons.sh

      - name: pnpm build
        run: pnpm -r --if-present run build

      # `scripts/electron-builder.sh`, not electron-builder directly: it owns `--publish never` (which
      # is load-bearing — electron-builder reads `CI=true` as consent to publish and otherwise dies
      # with `⨯ GitHub Personal Access Token is not set` after building everything) and the one
      # macOS signing conditional.
      #
      # **The four signing secrets are passed on every leg and are allowed to be empty.** With them,
      # the mac leg produces a Developer ID-signed, hardened, notarised and stapled app; without them
      # — a fork, or this repository until the maintainer runs the `gh secret set` lines in
      # docs/RELEASING.md §4 — the script falls back to an unsigned build rather than failing. That
      # fallback is the difference between a release that is merely unsigned and no release at all.
      # `APPLE_TEAM_ID` is public information and is written here rather than kept as a secret.
      # Check the notarisation credentials BEFORE the build, not after it. A bad or revoked
      # app-specific password fails here in seconds with Apple's own message; the same failure inside
      # electron-builder costs the whole build first — and every retry is another failed sign-in
      # against the Apple ID. Three of those in a row on 2026-08-29 locked the account
      # (`HTTP status code: 401. Your Apple ID has been locked`), which no re-run can fix. Runs with
      # no secrets skip this and build unsigned, exactly as the builder step does.
      - name: Notarisation credentials must be accepted (macOS, signed builds only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 3BMY24SA43
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then echo "no CSC_LINK: unsigned build, nothing to check"; exit 0; fi
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "CSC_LINK is set but APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD are not: the app would sign but not notarise." >&2
            echo "Set both (docs/RELEASING.md §4) or unset CSC_LINK for an unsigned build." >&2
            exit 1
          fi
          if ! out="$(xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1)"; then
            echo "$out" >&2
            echo >&2
            echo "notarytool rejected the credentials. Do NOT re-run this leg until they are fixed:" >&2
            echo "every failed attempt counts against the Apple ID and can lock it (docs/RELEASING.md §4.1)." >&2
            exit 1
          fi
          echo "notarytool accepted the credentials for $APPLE_TEAM_ID"

      - name: electron-builder ${{ matrix.builder }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 3BMY24SA43
        run: bash scripts/electron-builder.sh ${{ matrix.builder }}

      # electron-builder notarises and staples the .app, but it never submits the .dmg itself, so the
      # disk image carries no ticket of its own (run 33222399227: both apps `Notarization
      # Ticket=stapled`, both dmgs "does not have a ticket stapled to it"). A dmg without a ticket
      # still opens — Gatekeeper finds the app's stapled ticket once it is mounted — but it fails an
      # offline `spctl -t open` on the image and the stapler gate below. Submit each dmg and staple
      # it, with the same credentials the builder used. Signed builds only.
      - name: Notarise and staple the dmg (macOS, signed builds only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 3BMY24SA43
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then echo "no CSC_LINK: unsigned build, nothing to staple"; exit 0; fi
          for dmg in packages/app/release/*.dmg; do
            [ -f "$dmg" ] || continue
            echo "=== notarytool submit $dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
            xcrun stapler staple "$dmg"
          done

      # What the signature actually says, on the runner that made it — and a GATE when there was a
      # certificate to sign with. With no `CSC_LINK` the build is legitimately unsigned (a fork, or
      # this repository before the secrets existed) and the checks only report; with one, an app that
      # is not accepted by Gatekeeper as a notarised Developer ID build, or a `.dmg` with no stapled
      # ticket, fails the leg here rather than on a user's machine. Both slices, since only one of
      # them would otherwise be looked at.
      - name: Signature, Gatekeeper and staple
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -uo pipefail
          signed=1
          [ -n "${CSC_LINK:-}" ] || signed=0
          [ "$signed" = "1" ] || echo "no CSC_LINK: this build is unsigned, reporting only"
          rc=0
          for app in packages/app/release/mac-arm64/Tetravox.app packages/app/release/mac/Tetravox.app; do
            [ -d "$app" ] || continue
            echo "=== $app"
            codesign -dv --verbose=4 "$app" 2>&1 || rc=$((rc + signed))
            codesign --verify --deep --strict --verbose=2 "$app" 2>&1 || rc=$((rc + signed))
            # "accepted" plus "source=Notarized Developer ID" is the whole claim; `spctl` exits 0 for
            # an accepted-but-not-notarised app too, so the source line is checked, not just the code.
            out="$(spctl -a -vv -t install "$app" 2>&1)" || rc=$((rc + signed))
            echo "$out"
            if [ "$signed" = "1" ] && ! echo "$out" | grep -q 'Notarized Developer ID'; then
              echo "spctl did not report a Notarized Developer ID" >&2
              rc=$((rc + 1))
            fi
          done
          for dmg in packages/app/release/*.dmg; do
            [ -f "$dmg" ] || continue
            echo "=== stapler $dmg"
            xcrun stapler validate "$dmg" 2>&1 || rc=$((rc + signed))
          done
          exit "$rc"

      # §12.1: "launch the packaged binary with a CLI arg pointing at a fixture and assert it exits 0
      # after rendering one frame." macOS and Linux do exactly that; Windows asserts launch-and-exit,
      # for the reason scripts/smoke-artefact.mjs documents at length.
      - name: Artefact smoke test
        shell: bash
        run: node scripts/smoke-artefact.mjs ${{ matrix.smoke }}

      - name: Upload the workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tetravox-${{ matrix.os }}
          path: ${{ matrix.artefacts }}
          if-no-files-found: error
          retention-days: 14

      # Straight onto the Release from the runner that built them — no download-artifact round trip.
      # Tagged runs only: a `workflow_dispatch` has no Release to attach to.
      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.artefacts }}
          fail_on_unmatched_files: true

  # ------------------------------------------------------------------------------------------------
  # 3. Verify. A release is not done because four jobs went green — it is done when the assets a user
  #    will click on are actually attached.
  # ------------------------------------------------------------------------------------------------
  verify:
    name: Verify the Release assets
    needs: [create-release, sdk, build]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.create-release.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Every expected asset must be attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TAG: ${{ github.ref_name }}
          SDK_ASSET: ${{ needs.sdk.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/attached.txt
          echo "attached:"
          sed 's/^/  /' /tmp/attached.txt

          # REQUIRED — macOS and Linux are the priority platforms, and a release missing any of these
          # is not a release. The arch token is each ecosystem's own spelling of x64
          # (docs/RELEASING.md §1): `x86_64` for the AppImage, `amd64` for the deb.
          required=(
            "Tetravox-$VERSION-mac-arm64.dmg"
            "Tetravox-$VERSION-mac-arm64.zip"
            "Tetravox-$VERSION-mac-x64.dmg"
            "Tetravox-$VERSION-mac-x64.zip"
            "Tetravox-$VERSION-linux-x86_64.AppImage"
            "Tetravox-$VERSION-linux-amd64.deb"
            "Tetravox-$VERSION-linux-x64.tar.gz"
          )
          # The module SDK is required too: a release that ships a module host and no SDK is one
          # nobody can build a module against. Its name carries the host API and the core version
          # (`scripts/emit-module-sdk.mjs`), so it is taken from the job that emitted it rather than
          # spelled a second time here — a leg that did not run leaves it empty, which is reported
          # as the missing asset it is.
          if [ -n "${SDK_ASSET:-}" ]; then
            required+=("$SDK_ASSET")
          else
            echo "MISSING  the module SDK tarball (the sdk job produced no asset name)" >&2
            missing_sdk=1
          fi
          # OPTIONAL — Windows is a bonus leg. Absence is reported, not fatal.
          optional=("Tetravox-$VERSION-win-x64.exe")

          missing="${missing_sdk:-0}"
          for asset in "${required[@]}"; do
            if grep -qxF "$asset" /tmp/attached.txt; then
              echo "ok       $asset"
            else
              echo "MISSING  $asset (required)" >&2
              missing=1
            fi
          done
          for asset in "${optional[@]}"; do
            if grep -qxF "$asset" /tmp/attached.txt; then
              echo "ok       $asset (optional)"
            else
              echo "absent   $asset (optional — the Windows leg did not deliver)"
            fi
          done

          if [ "$missing" != "0" ]; then
            echo >&2
            echo "The draft Release is incomplete. Do not publish it: re-run the failed build leg," >&2
            echo "or delete the draft and the tag and cut the release again." >&2
            exit 1
          fi
          echo
          echo "All required assets are attached. Review the draft and press Publish."
