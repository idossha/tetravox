# Tetravox CI — docs/ARCHITECTURE.md §12.
#
# `test` runs on ubuntu-24.04 (the §11/§12.1 **golden authority**) on every event, and on macos-latest
# for push-to-main and workflow_dispatch only — macOS minutes bill 10x on a private repo (§12.1).
# The `package` legs of the §12.1 matrix are carried here from day one, as docs/ROADMAP.md Phase 0
# requires, but they are Phase 3's to make green and only run on demand — Phase 0 proves
# `pnpm package` on the host platform only, via the macOS `.dmg` step inside `test`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # §12.3: wasm-pack's version is pinned in scripts/build-wasm.sh and wasm-bindgen is pinned =0.2.127 in
  # Cargo.toml. A mismatch between the two produces glue that does not match the module.
  WASM_PACK_VERSION: '0.15.0'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # `contents: write` is for one thing only: the coverage-badge commit on the orphan `badges`
    # branch below. Nothing else in this job writes to the repository.
    permissions:
      contents: write
    # A green `test` leg is ~8 min on ubuntu and ~5 min on macOS (measured, run 33125834965). The cap
    # is not for the happy path; it is for the one where the engine cannot start. Playwright's
    # per-test timeout is 30 s and the engine suite is ~120 tests over two projects, so a page that
    # never publishes `window.__tvxEngine` does not hang — it fails once per test, one timeout at a
    # time, and bills every second of it. That is what run 33116778462 did on `main`: **3 h 14 m on a
    # macOS runner, at the 10x rate**, for a failure that was fully diagnosable from its first
    # minute. 45 min is five times a green run and still cuts that worst case by 4x.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # COST POLICY (DECISIONS 2026-08-27, §12.1): macOS runners bill 10x the minutes of Linux on a
        # private repo, so the macOS leg runs on push-to-main and workflow_dispatch only, NOT on
        # pull_request. ubuntu-24.04 is the golden authority (§11) and runs on every event, so a PR
        # is still gated on the runner whose goldens are authoritative; macOS is a pre-merge check
        # on main.
        #
        # This is the matrix and not a job-level `if:` because **the `matrix` context does not exist
        # in `jobs.<id>.if`** — only `github`, `needs`, `vars` and `inputs` do. A job `if` reading
        # `matrix.os` is not a false condition, it is an invalid workflow: the run fails in 0s with
        # "This run likely failed because of a workflow file issue" and no jobs at all (measured,
        # run 33122604659). `matrix` itself, by contrast, is evaluated early enough to read
        # `github.event_name`, so the leg is dropped from the matrix rather than skipped inside it.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04", "macos-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5

      # §12.2 names `~/.cache/electron` and `~/.cache/ms-playwright` as the caches to keep. macOS would
      # otherwise put both under `~/Library/Caches`, so pin the locations and cache one set of paths on
      # both runners. Set here rather than in `env:` because workflow `env:` is not shell-expanded.
      - name: Pin the download caches to the §12.2 paths
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$HOME/.cache/electron" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ toolchains
      # rust-toolchain.toml pins stable 1.93.0 with rustfmt, clippy and wasm32-unknown-unknown, and
      # rustup honours it. `rustup show` is what makes it install, before anything needs it.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
          rustup target list --installed

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # ------------------------------------------------------------------ caches (§12.2)
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ matrix.os }}-

      # §12.2: from electron 42 the ~100 MB binary is downloaded on FIRST LAUNCH, not on install, so
      # this cache is what keeps the warm-up step below from re-downloading it every run.
      - name: Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.os }}-

      # @playwright/test is pinned to an exact version because it pins the Chromium build, and therefore
      # the SwiftShader that produces every golden (§11). Key the cache on that exact version.
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ matrix.os }}-

      # ------------------------------------------------------------------ install
      - name: Install wasm-pack ${{ env.WASM_PACK_VERSION }} (pinned by scripts/build-wasm.sh)
        shell: bash
        run: |
          if [ "$(wasm-pack --version 2>/dev/null | awk '{print $2}')" != "$WASM_PACK_VERSION" ]; then
            cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked --force
          fi
          wasm-pack --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Electron needs an X server on Linux, and so will the Phase-1 app E2E. One Xvfb for every step
      # after this one; on macOS nothing is needed.
      - name: Start Xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          # Xvfb backgrounds immediately and is not listening yet; a step that exports DISPLAY and
          # walks away hands the next step a display that may not answer. Wait for it, and fail here
          # rather than as an unexplained Electron crash later.
          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb is answering on :99"
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Xvfb never came up on :99" >&2
          exit 1

      # §12.2, explicitly: a failed electron download must be its own red step, not a mysterious e2e
      # failure. On a cold cache this is where the ~100 MB binary is fetched.
      #
      # `--no-sandbox` on Linux, and it is not optional. Chromium's SUID sandbox helper ships inside
      # the npm tarball as a plain user-owned file, and Chromium refuses to run rather than drop the
      # sandbox silently:
      #   FATAL:sandbox/linux/suid/client/setuid_sandbox_host.cc:166] The SUID sandbox helper binary
      #   was found, but is not configured correctly. ... chrome-sandbox is owned by root and has
      #   mode 4755.
      # It aborts with SIGTRAP before printing the version, so even `--version` fails. The packaged
      # AppImage has the same problem, which is why §12.2 already says Linux needs `--no-sandbox` and
      # why `packages/app/e2e/fixtures.ts` passes it on every Linux launch. `chown root` + `chmod
      # 4755` on the binary would be the other fix; it is rejected here because it would make this
      # step the only place in the project that runs Electron sandboxed, so a sandbox regression
      # would still not be caught, at the cost of a sudo write into node_modules.
      - name: Warm up the electron binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm exec electron --no-sandbox --version
          else
            pnpm exec electron --version
          fi

      - name: Install the pinned Chromium
        run: pnpm exec playwright install --with-deps chromium

      # §11 / AGENTS: real-data tests are gated on TETRAVOX_TESTDATA and must SKIP, never fail, in CI.
      # Assert it is unset so a future `env:` entry is a loud failure rather than a silent slowdown.
      - name: TETRAVOX_TESTDATA must be unset in CI
        shell: bash
        run: |
          if [ -n "${TETRAVOX_TESTDATA:-}" ]; then
            echo "TETRAVOX_TESTDATA is set ('$TETRAVOX_TESTDATA'); CI runs synthetic fixtures only." >&2
            exit 1
          fi
          echo "TETRAVOX_TESTDATA is unset — real-data tests will skip, as intended."

      # ------------------------------------------------------------------ rust
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # ------------------------------------------------------------------ node
      # §2: `pnpm wasm` is a prerequisite of build / test / typecheck. Never typecheck against a
      # missing pkg/.
      - name: pnpm wasm
        run: pnpm wasm

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      # Coverage on the golden-authority leg only (ubuntu-24.04): one number, not one per OS.
      # `pnpm run wasm` already ran above; `vitest run --coverage` reuses the same build.
      - name: pnpm test:coverage
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm run test:coverage

      # `lcov.info`, NOT `coverage-summary.json`: Codecov parses lcov/cobertura/clover and istanbul's
      # `coverage-final.json`, and a `json-summary` file is none of those — it uploads, is rejected as
      # an unusable report, and the shields badge stays "unknown" forever with nothing red to explain
      # why. `vitest.config.ts` emits both reporters; the summary is what the badge fallback below
      # reads, lcov is what Codecov reads.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      # …and the badge the README actually shows, because the upload above cannot succeed on this
      # repository: with no `CODECOV_TOKEN` the uploader answers
      # `Token required - not valid tokenless upload` and, with `fail_ci_if_error: false`, stays
      # green — so the shields badge read "coverage unknown" with nothing red to explain it. The
      # number is published from this run's own summary to the orphan `badges` branch and rendered
      # through `img.shields.io/endpoint`. Push to `main` only: a PR must not move the badge.
      - name: Publish the coverage badge to the `badges` branch
        if: ${{ matrix.os == 'ubuntu-24.04' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/coverage-badge.mjs --in coverage/coverage-summary.json --out "$RUNNER_TEMP/coverage.json"
          cd "$RUNNER_TEMP"
          rm -rf badges-branch
          git clone --depth 1 --branch badges \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges-branch \
            || { mkdir badges-branch && cd badges-branch && git init -q -b badges \
                 && git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" && cd ..; }
          cp coverage.json badges-branch/coverage.json
          cd badges-branch
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add coverage.json
          if git diff --cached --quiet; then
            echo "coverage badge unchanged"
            exit 0
          fi
          git commit -q -m "coverage: $(node -e "process.stdout.write(require('./coverage.json').message)") (${GITHUB_SHA:0:7})"
          git push origin HEAD:badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Engine Playwright (§11 goldens + analytic pixels) and, once packages/app has an `e2e` script,
      # the Playwright-Electron app E2E — `pnpm e2e` is `pnpm -r --if-present run e2e`, so the app leg
      # joins this step by existing. Dev build only; packaging is separate.
      # Two engine Playwright projects (§11): `chromium-swiftshader` captures the goldens, and
      # `chromium-angle` runs the `@angle`-tagged analytic tests on the full Chromium so they reach
      # the platform GPU — the only place the R16 branch of the §6.1 ladder can execute, since
      # SwiftShader has no EXT_texture_norm16. Both legs are HEADLESS (docs/TESTING.md §2.1 measures
      # that headless costs the ANGLE leg no capability); the Xvfb above still serves Electron.
      #
      # `chromium-angle` now FAILS if it lands on a software renderer, because such a leg is empty —
      # every @angle test then self-skips or passes vacuously — and an empty leg must not be green.
      # The Linux runner has no GPU, so it opts out by name; macOS stays strict, and a hosted macOS
      # runner that cannot reach Metal is a red leg naming this variable rather than a silent hole.
      - name: pnpm e2e
        env:
          TETRAVOX_ALLOW_SOFTWARE_ANGLE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: pnpm e2e

      # Both suites `pnpm e2e` runs, not just the engine's: the app's dev-leg report was uploaded on
      # no runner at all (the `packaged` step below collects packages/app, but only on macOS), so an
      # app E2E failure on Linux left its screenshots and traces on the runner and nothing to look at
      # here. That is the leg that is hardest to reproduce locally, so it is the one that most needs
      # its artefacts.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            packages/engine/playwright-report
            packages/engine/test-results
            packages/app/playwright-report
            packages/app/test-results
          retention-days: 7
          if-no-files-found: ignore

      # ------------------------------------------------------------------ packaging (Phase 0: macOS only)
      # ROADMAP Phase-0 gate 2 is "the HOST platform's packaged artefact", and `pnpm package` builds this
      # platform's artefacts only (§12.1) — so a .dmg here and nothing on Linux. No continue-on-error:
      # once packages/app has a `package` script, a broken .dmg is a red build.
      - name: Package .dmg (macOS only)
        if: runner.os == 'macOS'
        continue-on-error: false
        shell: bash
        run: |
          if node -e "process.exit(require('./packages/app/package.json').scripts?.package ? 0 : 1)"; then
            pnpm package
          else
            echo "packages/app has no 'package' script yet (Phase-0 stage 2 owns it) — nothing to build."
          fi

      # ROADMAP Phase-0 gate 2 — "the packaged artefact, not the dev server, draws a WASM-coloured
      # triangle from tetravox://app/index.html" — is proved ONLY by the `packaged` Playwright project,
      # and `pnpm e2e` above deliberately self-skips it (nothing has been packaged at that point). So the
      # gate needs its own step here, after the .dmg exists. `TETRAVOX_REQUIRE_PACKAGED=1` makes a skip a
      # failure, so this leg cannot go green without actually launching the artefact.
      - name: Packaged E2E — ROADMAP Phase-0 gate 2 (macOS only)
        if: runner.os == 'macOS'
        env:
          TETRAVOX_REQUIRE_PACKAGED: '1'
        run: pnpm --filter @tetravox/app run e2e:packaged

      - name: Upload the packaged Playwright report
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-packaged-${{ matrix.os }}
          path: |
            packages/app/playwright-report
            packages/app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The §12.1 `package` matrix, now real (ROADMAP Phase 3). Each leg builds one slice with
  # electron-builder, runs the artefact smoke test §12.1 requires, and uploads the result as a
  # downloadable workflow artefact. `.github/workflows/release.yml` is the same matrix on a tag, plus
  # a draft GitHub Release; this one exists so a packaging regression is caught before a tag, and so
  # every push to `main` leaves builds anyone can download and try.
  #
  # **Push to `main` and `workflow_dispatch` only.** Pull requests build nothing: `test` already gates
  # them, packaging costs ~5 minutes of runner per leg, and a source change that breaks packaging
  # without breaking a test is rare enough to catch on `main`. A job-level `if:` is legal here because
  # it reads `github`, not `matrix` — the restriction that shapes the `test` matrix above does not
  # apply.
  package:
    name: package (${{ matrix.name }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows is the optional platform (see release.yml): it is built and launch-verified, and a
    # failure there is a yellow leg rather than a red build. macOS and Linux are `required: yes` and
    # fail the workflow.
    continue-on-error: ${{ matrix.required == 'no' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE mac runner for BOTH slices — `electron-builder.yml` declares `arch: [arm64, x64]`, so
          # this leg emits every mac artefact, and `--all` smoke-tests both: arm64 natively and x64
          # under Rosetta 2, both on the runner's real GPU. The `macos-26-intel` leg this replaces
          # had no Metal device and no software fallback to reach for — macOS ANGLE offers only
          # `metal` and `swiftshader`, and SwiftShader's Vulkan backend does not initialise there —
          # so it could build the x64 slice but never render it (release.yml has the measurements).
          - name: macOS arm64 + x64 (dmg + zip)
            os: macos-latest
            builder: --mac
            smoke: --all
            required: 'yes'
            artefacts: |
              packages/app/release/*.dmg
              packages/app/release/*.zip
          # No GPU on a hosted Linux runner: the GPU process dies during initialisation under Xvfb
          # and the renderer reports `vertex shader failed to compile: (no log)` from a context that
          # is already gone. `--software-gl` names ANGLE/SwiftShader explicitly (`src/main/index.ts`
          # §2) — the same software rendering the `chromium-swiftshader` Playwright project uses.
          - name: Linux x64 (AppImage + deb + tar.gz)
            os: ubuntu-24.04
            builder: --linux --x64
            smoke: --software-gl
            required: 'yes'
            artefacts: |
              packages/app/release/*.AppImage
              packages/app/release/*.deb
              packages/app/release/*.tar.gz
          - name: Windows x64 (nsis, optional)
            os: windows-latest
            builder: --win --x64
            smoke: --version-only
            required: 'no'
            artefacts: |
              packages/app/release/*.exe
    steps:
      - uses: actions/checkout@v5

      - name: Pin the download caches to the §12.2 paths
        shell: bash
        run: echo "ELECTRON_CACHE=$HOME/.cache/electron" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ matrix.os }}-

      - name: Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ matrix.os }}-

      - name: Install wasm-pack ${{ env.WASM_PACK_VERSION }} (pinned by scripts/build-wasm.sh)
        shell: bash
        run: |
          if [ "$(wasm-pack --version 2>/dev/null | awk '{print $2}')" != "$WASM_PACK_VERSION" ]; then
            cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked --force
          fi
          wasm-pack --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The smoke test launches the packaged binary, so this leg needs the same runtime libraries and
      # display the `test` leg does. `libasound2t64` is the 24.04 name (§12.2 / the t64 rename).
      - name: Linux runtime deps + Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libgtk-3-0 libnss3 libasound2t64
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Xvfb never came up on :99" >&2
          exit 1

      - name: pnpm wasm
        run: pnpm wasm

      - name: Icons must be present (never ship the stock Electron logo)
        shell: bash
        run: bash scripts/ensure-icons.sh

      - name: pnpm build
        run: pnpm -r --if-present run build

      # `scripts/electron-builder.sh` owns `--publish never` (load-bearing: electron-builder reads
      # `CI=true` as consent to publish and otherwise fails with `⨯ GitHub Personal Access Token is
      # not set` after building everything) and the macOS signing conditional.
      #
      # NO SIGNING SECRETS HERE, deliberately: this workflow runs on every push to `main` and must
      # work identically in a fork. The script sees no `CSC_LINK` and builds unsigned — which also
      # means this is the leg that keeps the *unsigned* path honest, since release.yml only ever
      # exercises the signed one.
      - name: electron-builder ${{ matrix.builder }}
        shell: bash
        run: bash scripts/electron-builder.sh ${{ matrix.builder }}

      # §12.1: "launch the packaged binary with a CLI arg pointing at a fixture and assert it exits 0
      # after rendering one frame." That is `scripts/smoke-artefact.mjs`.
      # `TETRAVOX_SOFTWARE_GL=1`: hosted runners have no GPU, and the packaged app's GPU process dies
      # on them — Linux under Xvfb exits it "due to errors during initialization" and the hosted Intel
      # macOS image fails `GLDisplayEGL::Initialize`, after which every shader returns
      # "failed to compile: (no log)" and the job writes no frame. `src/main/index.ts` reads this
      # variable and adds `--disable-gpu`, the same thing `e2e/fixtures.ts` already does on Linux, so
      # the render happens in SwiftShader in-process. What the leg proves is unchanged: the packaged
      # binary starts, loads the fixtures and writes a real PNG.
      - name: Artefact smoke test
        shell: bash
        run: node scripts/smoke-artefact.mjs ${{ matrix.smoke }}

      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tetravox-ci-${{ matrix.os }}
          path: ${{ matrix.artefacts }}
          if-no-files-found: error
          retention-days: 7
