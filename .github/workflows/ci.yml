# Tetravox CI — docs/ARCHITECTURE.md §12.
#
# The jobs, and why they are separate: `test` is the static and unit half (rust, typecheck, lint,
# vitest), `e2e` is the Playwright half fanned out over shards, `docs-guard` and `python` are
# seconds-long guards that must report before either finishes, and `package` builds the §12.1
# matrix. `test` and `e2e` run CONCURRENTLY and neither waits on the other — e2e was 67% of the
# old single job, so splitting it out and sharding the engine is what takes a pull request from
# ~11 min to ~4 (measured, run 33441930192).
#
# Everything heavy runs on ubuntu-24.04 (the §11/§12.1 **golden authority**) on every event, and on
# macos-latest for workflow_dispatch only — macOS minutes bill 10x on a private repo (§12.1).
# The `package` legs of the §12.1 matrix are carried here from day one, as docs/ROADMAP.md Phase 0
# requires — Phase 0 proves `pnpm package` on the host platform only, via the macOS `.dmg` step
# inside `test`.
#
# Toolchains, caches and the install are one composite action, `.github/actions/setup`, shared by
# all three heavy jobs: three copies of a cache key is how a cache quietly stops being hit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # §12.3: wasm-pack's version is pinned in scripts/build-wasm.sh and wasm-bindgen is pinned =0.2.127 in
  # Cargo.toml. A mismatch between the two produces glue that does not match the module.
  WASM_PACK_VERSION: '0.15.0'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # ~3 min green now that the Playwright suites are their own job (they were 442 s of an 11 min
    # leg). The runaway this cap exists for moved with them — see `e2e`'s own timeout — but the
    # macOS leg still packages and launches an artefact, so keep real headroom.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # COST POLICY (DECISIONS 2026-08-27, §12.1): macOS runners bill 10x the minutes of Linux on a
        # private repo, so the macOS leg runs on push-to-main and workflow_dispatch only, NOT on
        # pull_request. ubuntu-24.04 is the golden authority (§11) and runs on every event, so a PR
        # is still gated on the runner whose goldens are authoritative; macOS is a pre-merge check
        # on main.
        #
        # This is the matrix and not a job-level `if:` because **the `matrix` context does not exist
        # in `jobs.<id>.if`** — only `github`, `needs`, `vars` and `inputs` do. A job `if` reading
        # `matrix.os` is not a false condition, it is an invalid workflow: the run fails in 0s with
        # "This run likely failed because of a workflow file issue" and no jobs at all (measured,
        # run 33122604659). `matrix` itself, by contrast, is evaluated early enough to read
        # `github.event_name`, so the leg is dropped from the matrix rather than skipped inside it.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04", "macos-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v5

      # Toolchains, the §12.2 caches and the install — shared with `e2e` and `package`, see
      # `.github/actions/setup`. No Playwright browser and no Xvfb: since the e2e suites moved to
      # their own job this leg launches a browser on no runner, and on macOS the packaged E2E below
      # drives the Electron binary, which needs neither.
      - uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}
          wasm-pack-version: ${{ env.WASM_PACK_VERSION }}
          electron: 'true'

      # §11 / AGENTS: real-data tests are gated on TETRAVOX_TESTDATA and must SKIP, never fail, in CI.
      # Assert it is unset so a future `env:` entry is a loud failure rather than a silent slowdown.
      - name: TETRAVOX_TESTDATA must be unset in CI
        shell: bash
        run: |
          if [ -n "${TETRAVOX_TESTDATA:-}" ]; then
            echo "TETRAVOX_TESTDATA is set ('$TETRAVOX_TESTDATA'); CI runs synthetic fixtures only." >&2
            exit 1
          fi
          echo "TETRAVOX_TESTDATA is unset — real-data tests will skip, as intended."

      # ------------------------------------------------------------------ rust
      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # ------------------------------------------------------------------ node
      # §2: `pnpm wasm` is a prerequisite of build / test / typecheck. Never typecheck against a
      # missing pkg/.
      - name: pnpm wasm
        run: pnpm wasm

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm lint
        run: pnpm lint

      # §13.8: `@tetravox/module-sdk` is generated from `host.ts`, the manifest contract and the
      # engine's frozen type files, so a change to any of them that would break a module's typecheck
      # is red HERE, in the run that made it — not in a module repository a week later. This is the
      # emission in full, gates and all (`--no-tarball`: the release workflow is what packs one).
      - name: Emit the module SDK
        run: node scripts/emit-module-sdk.mjs --no-tarball

      # `pnpm exec vitest run`, NOT `pnpm test`. The root `test` script is
      # `cargo test --workspace && pnpm run wasm && vitest run` — the right one-liner locally, and a
      # ~50 s duplicate here, because the two steps above have just run both prerequisites (measured,
      # run 33441930192: this step billed 49 s and re-ran the identical 20-test cargo suite, 21.74 s
      # against 21.78 s). Naming vitest directly also keeps a wasm failure and a unit-test failure as
      # two different red steps instead of one.
      - name: vitest
        run: pnpm exec vitest run

      # ------------------------------------------------------------------ packaging (Phase 0: macOS only)
      # ROADMAP Phase-0 gate 2 is "the HOST platform's packaged artefact", and `pnpm package` builds this
      # platform's artefacts only (§12.1) — so a .dmg here and nothing on Linux. No continue-on-error:
      # once packages/app has a `package` script, a broken .dmg is a red build.
      #
      # `pnpm build` explicitly, because `packages/app`'s `package` script is electron-builder
      # ALONE — it builds nothing. Until the e2e suites moved to their own job this
      # leg got `out/` for free from `pnpm e2e` (the app's `e2e` script is `electron-vite build &&
      # playwright test`), which was a real dependency on an unrelated step and is now an explicit
      # one. The `package` job below already has this step, for the same reason.
      - name: pnpm build (macOS only — electron-builder packages `out/`, it does not create it)
        if: runner.os == 'macOS'
        run: pnpm -r --if-present run build

      - name: Package .dmg (macOS only)
        if: runner.os == 'macOS'
        continue-on-error: false
        shell: bash
        run: |
          if node -e "process.exit(require('./packages/app/package.json').scripts?.package ? 0 : 1)"; then
            pnpm package
          else
            echo "packages/app has no 'package' script yet (Phase-0 stage 2 owns it) — nothing to build."
          fi

      # ROADMAP Phase-0 gate 2 — "the packaged artefact, not the dev server, draws a WASM-coloured
      # triangle from tetravox://app/index.html" — is proved ONLY by the `packaged` Playwright project,
      # which the `e2e` job deliberately never reaches (nothing is packaged on that runner, so the
      # project self-skips there). So the gate needs its own step here, after the .dmg exists.
      # `TETRAVOX_REQUIRE_PACKAGED=1` makes a skip a failure, so this leg cannot go green without actually launching the artefact.
      - name: Packaged E2E — ROADMAP Phase-0 gate 2 (macOS only)
        if: runner.os == 'macOS'
        env:
          TETRAVOX_REQUIRE_PACKAGED: '1'
        run: pnpm --filter @tetravox/app run e2e:packaged

      - name: Upload the packaged Playwright report
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-packaged-${{ matrix.os }}
          path: |
            packages/app/playwright-report
            packages/app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The Playwright suites, lifted out of `test` and fanned out. Its own job because e2e was 67% of
  # `test` and nothing else in that job waits on it: measured on run 33441930192, `pnpm e2e` billed
  # 442 s of an 11 min leg, against 49 s for vitest and 34 s for typecheck. Running the two
  # concurrently is most of the saving; sharding the engine is the rest.
  #
  # `pnpm -r` ran the three suites back to back, and they are wildly uneven — engine 348 s (235
  # tests), app 66 s (574 declared, 399 of them real-data skips), wasm 24 s. So the engine is split
  # three ways with `--shard` and the two small suites share one leg.
  #
  # **Sharding is safe here, and widening `workers` would not be.** Every config is
  # `fullyParallel: false, workers: 1` because a golden is a function of one renderer drawing one
  # scene at a time (§11). A shard is a SEPARATE PROCESS with its own browser, still at one worker,
  # so the invariant holds exactly as before; raising `workers` inside a process is the thing that
  # would make goldens flaky, and this does not do it.
  #
  # macOS keeps ONE unsharded engine leg (workflow_dispatch only, per the §12.1 cost policy on the
  # `test` matrix above): it is the only runner that reaches Metal, so it is where the
  # `chromium-angle` project is a real leg rather than a self-skip, and splitting it three ways
  # would triple a 10x-billed runner to save a few minutes on a run nobody is waiting for.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # A shard is ~2 min. The cap is for the run where the engine cannot start: Playwright's per-test
    # timeout is 30 s and a page that never publishes `window.__tvxEngine` fails once per test, one
    # timeout at a time, billing every second — run 33116778462 did exactly that for **3 h 14 m on a
    # macOS runner at the 10x rate**, for a failure diagnosable from its first minute. 20 min is many
    # times a green shard and cuts that worst case by an order of magnitude.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Enumerated rather than a cross product, because the macOS legs are not the Linux legs: see
        # the note above on why macOS does not shard. The `test` job's comment on why this is a
        # matrix expression and never a job-level `if:` applies here verbatim — `matrix` does not
        # exist in `jobs.<id>.if`, and reading it there is an invalid workflow, not a false one.
        include: ${{ github.event_name == 'workflow_dispatch' && fromJSON('[{"os":"ubuntu-24.04","name":"engine 1/3","leg":"engine","shard":"1/3"},{"os":"ubuntu-24.04","name":"engine 2/3","leg":"engine","shard":"2/3"},{"os":"ubuntu-24.04","name":"engine 3/3","leg":"engine","shard":"3/3"},{"os":"ubuntu-24.04","name":"app + wasm","leg":"app+wasm","shard":""},{"os":"macos-latest","name":"engine (macOS, ANGLE/Metal)","leg":"engine","shard":""},{"os":"macos-latest","name":"app + wasm (macOS)","leg":"app+wasm","shard":""}]') || fromJSON('[{"os":"ubuntu-24.04","name":"engine 1/3","leg":"engine","shard":"1/3"},{"os":"ubuntu-24.04","name":"engine 2/3","leg":"engine","shard":"2/3"},{"os":"ubuntu-24.04","name":"engine 3/3","leg":"engine","shard":"3/3"},{"os":"ubuntu-24.04","name":"app + wasm","leg":"app+wasm","shard":""}]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}
          wasm-pack-version: ${{ env.WASM_PACK_VERSION }}
          playwright: 'true'
          electron: 'true'
          xvfb: 'true'

      # §11 / AGENTS: real-data tests are gated on TETRAVOX_TESTDATA and must SKIP, never fail, in CI.
      # Asserted in this job as well as in `test` because this is where those tests actually live —
      # the 399 skips in the app suite are them.
      - name: TETRAVOX_TESTDATA must be unset in CI
        shell: bash
        run: |
          if [ -n "${TETRAVOX_TESTDATA:-}" ]; then
            echo "TETRAVOX_TESTDATA is set ('$TETRAVOX_TESTDATA'); CI runs synthetic fixtures only." >&2
            exit 1
          fi
          echo "TETRAVOX_TESTDATA is unset — real-data tests will skip, as intended."

      # §2: `pnpm wasm` is a prerequisite of build / test / typecheck. The engine's pages and the
      # app's build both load `pkg/`, so it is a prerequisite of every leg here too.
      - name: pnpm wasm
        run: pnpm wasm

      # Two engine Playwright projects (§11): `chromium-swiftshader` captures the goldens, and
      # `chromium-angle` runs the `@angle`-tagged analytic tests on the full Chromium so they reach
      # the platform GPU — the only place the R16 branch of the §6.1 ladder can execute, since
      # SwiftShader has no EXT_texture_norm16. Both legs are HEADLESS (docs/TESTING.md §2.1 measures
      # that headless costs the ANGLE leg no capability); the Xvfb from the setup action still serves
      # Electron in the app leg.
      #
      # `chromium-angle` FAILS if it lands on a software renderer, because such a leg is empty —
      # every @angle test then self-skips or passes vacuously — and an empty leg must not be green.
      # The Linux runner has no GPU, so it opts out by name; macOS stays strict, and a hosted macOS
      # runner that cannot reach Metal is a red leg naming this variable rather than a silent hole.
      #
      # A sharded leg reports `blob`, which `e2e-report` merges back into the ONE html report a
      # reviewer opens. An unsharded leg keeps the config's own reporters and uploads its report
      # directly — there is nothing to merge it with.
      # `exec playwright test`, NOT `run e2e -- --shard=…`. **pnpm silently swallows the arguments
      # after `--`** on a filtered `run` — verified locally: `pnpm --filter @tetravox/engine run e2e
      # -- --shard=1/3 --list` ran the whole suite for real instead of listing a third of it, with no
      # warning. A shard flag that vanishes would not fail the leg; it would run every shard over the
      # full suite and go green, which is the worst possible failure mode for this change. The
      # engine's `e2e` script is exactly `playwright test`, so calling it directly loses nothing.
      - name: Engine Playwright ${{ matrix.shard && format('(shard {0})', matrix.shard) || '' }}
        id: engine
        if: matrix.leg == 'engine'
        env:
          TETRAVOX_ALLOW_SOFTWARE_ANGLE: ${{ runner.os == 'Linux' && '1' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.shard }}" ]; then
            pnpm --filter @tetravox/engine exec playwright test --shard="${{ matrix.shard }}" --reporter=blob
          else
            pnpm --filter @tetravox/engine exec playwright test
          fi

      - name: wasm Playwright
        if: matrix.leg == 'app+wasm'
        run: pnpm --filter @tetravox/wasm run e2e

      # `electron-vite build && playwright test`, so this is also what makes `out/renderer/assets/`
      # fresh for the loader guard below.
      - name: App Playwright (Electron)
        if: matrix.leg == 'app+wasm'
        run: pnpm --filter @tetravox/app run e2e

      # §13.8's loader guard, and the only place it can run: the extension loader's *variable* dynamic
      # import is rewritten by Vite into an EMPTY glob helper if the `@vite-ignore` comment is ever lost
      # — silently, with no build warning and no failing unit test — so the claim is checked against the
      # emitted chunk. It rides the app leg because that leg's `e2e` script has just built the renderer;
      # anywhere else it would need a second build of its own.
      - name: The extension loader survived the build
        if: matrix.leg == 'app+wasm'
        run: node scripts/check-module-loader.mjs

      # The blob from a sharded leg: not a report anyone opens, an input to `e2e-report`.
      #
      # `if-no-files-found: error` is kept — a shard that RAN and wrote no blob is a real problem —
      # but the step is skipped when the Playwright step never ran, because a leg that died in setup
      # would otherwise report a second, misleading failure on top of the real one. That is exactly
      # what run 33444860430 did: `pnpm wasm` failed, and the missing blob was the louder red.
      - name: Upload the blob report (sharded legs)
        if: ${{ matrix.shard != '' && !cancelled() && steps.engine.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-engine-${{ matrix.os }}-${{ strategy.job-index }}
          path: packages/engine/blob-report
          retention-days: 7
          if-no-files-found: error

      # Unsharded legs upload the real thing. Both suites the app leg runs, not just one: the app's
      # dev-leg report was uploaded on no runner at all before, so an app E2E failure on Linux left
      # its screenshots and traces on the runner and nothing to look at here. That is the leg hardest
      # to reproduce locally, so it is the one that most needs its artefacts.
      - name: Upload the Playwright report (unsharded legs)
        if: ${{ matrix.shard == '' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.leg == 'engine' && 'engine' || 'app-wasm' }}-${{ matrix.os }}
          path: |
            packages/engine/playwright-report
            packages/engine/test-results
            packages/app/playwright-report
            packages/app/test-results
            packages/wasm/playwright-report
            packages/wasm/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Sharding costs one thing worth paying for and one worth fixing: three partial reports instead of
  # the single link a reviewer follows to a failing golden. This job is the fix — `merge-reports`
  # stitches the shards' blobs back into one html report, so what you open after a red run is exactly
  # what you opened before this change.
  #
  # `!cancelled()` and not `success()`: the merged report matters MOST when a shard failed.
  e2e-report:
    name: e2e report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # No toolchains and no browser: `merge-reports` reads zips and writes html. `--ignore-scripts`
      # keeps it to the dependency graph, since nothing here builds.
      - name: pnpm install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `continue-on-error`, because `download-artifact` treats "the pattern matched nothing" as a
      # hard failure — and nothing is exactly what it finds when every shard died before writing a
      # blob. That case is already a red `e2e`; it must not also produce a confusing red report job.
      - name: Download the shard blobs
        id: blobs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: blob-engine-*
          path: blob-report
          merge-multiple: true

      - name: Merge the shard reports
        shell: bash
        env:
          # Both spellings: the variable was renamed across Playwright versions and neither is
          # harmful. Without it `merge-reports --reporter=html` tries to open a browser.
          PLAYWRIGHT_HTML_OPEN: never
          PW_TEST_HTML_REPORT_OPEN: never
        run: |
          set -euo pipefail
          shopt -s nullglob
          blobs=(blob-report/*.zip)
          if [ ${#blobs[@]} -eq 0 ]; then
            echo "No shard blobs to merge — see the red \`e2e\` legs, which failed before reporting."
            exit 0
          fi
          echo "Merging ${#blobs[@]} shard blob(s)."
          pnpm --filter @tetravox/engine exec playwright merge-reports --reporter=html ../../blob-report

      - name: Upload the merged Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-engine-merged
          path: packages/engine/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # The §12.1 docs guard (ARCHITECTURE.md §12.1, §12.3, §13.7). Its **own** job, and not a step of
  # `test`, for two reasons: it needs `fetch-depth: 0` (actions/checkout@v5 defaults to depth 1 and a
  # merge-base diff cannot be computed from one commit), and it must report on a pull request even
  # when the test leg is still running — "you changed a frozen interface and not its documentation"
  # is the kind of thing a reviewer should read before the tests finish, not after.
  #
  # It costs ~20 seconds: node, a diff and two file reads. No pnpm install, no toolchains.
  docs-guard:
    name: docs-guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: `git merge-base` is the point of this job.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # A guard nobody has seen fail is a guard nobody trusts, so its own fixtures run first — a
      # frozen path with no docs, with half the docs, a manifest naming a heading nobody wrote.
      - name: Self-test the guard
        run: node --test scripts/check-frozen-docs.test.mjs

      # `github.event.pull_request.base.sha` on a PR; `github.event.before` on a push. Neither exists
      # for a `workflow_dispatch`, and the script then says so and checks only the rule that needs no
      # diff, rather than failing because it could not do half its job.
      - name: Frozen interfaces and module docs headings
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/check-frozen-docs.mjs --base "$BASE"

      # The generated half of the same rule (§13.6): `docs/AUTOMATION.md` §2.7 is written from the
      # module manifests, so a table that drifts from the manifest the job validator reads would tell
      # a user a job is legal that the validator refuses. Same class of failure as the two above, and
      # the same 20-second runner: node, a diff and two file reads.
      - name: Self-test the module-docs generator
        run: node --test scripts/sync-module-docs.test.mjs

      - name: AUTOMATION.md §2.7 matches the manifests
        run: node scripts/sync-module-docs.mjs --check

      # §13.8's node-only guard, here rather than in `test` for this job's own reason: it needs no
      # install or toolchain, and "the SDK's engine subset no longer closes" is a thing a reviewer
      # should read before the tests finish. The *full* SDK emission needs `tsc` and runs in `test`;
      # what runs here are its rules.
      - name: Self-test the module SDK emitter
        run: node --test scripts/emit-module-sdk.test.mjs

      # §13.8's loader guard, self-tested here and *run* in `test` (it needs a build). Its fixtures are
      # the three ways the loader can stop working, driven red — one of which is silent in every other
      # test the repository has.
      - name: Self-test the extension loader guard
        run: node --test scripts/check-module-loader.test.mjs

  # The Python client's document tests (`docs/AUTOMATION.md` §3) — **the first Python step in this
  # workflow**, and its own job for the docs guard's reasons rather than a step of `test`: it needs
  # no pnpm install, no toolchain and no build, it is ~20 seconds, and putting it in `test` would run
  # it a second time on the macOS leg at 10x the minutes for identical coverage.
  #
  # The client is standard library only (that is a design decision, not an omission — see
  # `python/pyproject.toml`), so this installs nothing at all. `test_client.py`'s end-to-end half and
  # `test_capture_examples.py` skip when there is no build and no data, which is the same
  # skip-never-fail rule every real-data test in the repository follows: CI checks the documents a
  # `Job` builds, which is the half that is the contract with `main/job.ts`.
  python:
    name: python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Client document tests
        run: python -m unittest discover -s python/tests --verbose

  # The §12.1 `package` matrix, now real (ROADMAP Phase 3). Each leg builds one slice with
  # electron-builder, runs the artefact smoke test §12.1 requires, and uploads the result as a
  # downloadable workflow artefact. `.github/workflows/release.yml` is the same matrix on a tag, plus
  # a draft GitHub Release; this one exists so a packaging regression is caught before a tag, and so
  # every push to `main` leaves builds anyone can download and try.
  #
  # **Push to `main` and `workflow_dispatch` only.** Pull requests build nothing: `test` already gates
  # them, packaging costs ~5 minutes of runner per leg, and a source change that breaks packaging
  # without breaking a test is rare enough to catch on `main`. A job-level `if:` is legal here because
  # it reads `github`, not `matrix` — the restriction that shapes the `test` matrix above does not
  # apply.
  package:
    name: package (${{ matrix.name }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # `docs-guard`, NOT `test`. Packaging consumes nothing the test job produces — it checks out the
    # same commit and builds it from source — so `needs: test` bought nothing but a serial wait, and
    # it was the dominant cost on `main`: 9 min of `test` before a 4-6 min package leg could start
    # (measured, run 33432806778 — 32 min elapsed for ~15 min of work). A red `test` is still a red
    # run; it simply no longer gates the artefacts. `docs-guard` is kept as the gate because it is
    # 20 s and catches the class of mistake that should never reach a downloadable build.
    needs: docs-guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows is the optional platform (see release.yml): it is built and launch-verified, and a
    # failure there is a yellow leg rather than a red build. macOS and Linux are `required: yes` and
    # fail the workflow.
    continue-on-error: ${{ matrix.required == 'no' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE mac runner for BOTH slices — `electron-builder.yml` declares `arch: [arm64, x64]`, so
          # this leg emits every mac artefact, and `--all` smoke-tests both: arm64 natively and x64
          # under Rosetta 2, both on the runner's real GPU. The `macos-26-intel` leg this replaces
          # had no Metal device and no software fallback to reach for — macOS ANGLE offers only
          # `metal` and `swiftshader`, and SwiftShader's Vulkan backend does not initialise there —
          # so it could build the x64 slice but never render it (release.yml has the measurements).
          - name: macOS arm64 + x64 (dmg + zip)
            os: macos-latest
            builder: --mac
            smoke: --all
            required: 'yes'
            artefacts: |
              packages/app/release/*.dmg
              packages/app/release/*.zip
          # No GPU on a hosted Linux runner: the GPU process dies during initialisation under Xvfb
          # and the renderer reports `vertex shader failed to compile: (no log)` from a context that
          # is already gone. `--software-gl` names ANGLE/SwiftShader explicitly (`src/main/index.ts`
          # §2) — the same software rendering the `chromium-swiftshader` Playwright project uses.
          - name: Linux x64 (AppImage + deb + tar.gz)
            os: ubuntu-24.04
            builder: --linux --x64
            smoke: --software-gl
            required: 'yes'
            artefacts: |
              packages/app/release/*.AppImage
              packages/app/release/*.deb
              packages/app/release/*.tar.gz
          - name: Windows x64 (nsis, optional)
            os: windows-latest
            builder: --win --x64
            smoke: --version-only
            required: 'no'
            artefacts: |
              packages/app/release/*.exe
    steps:
      - uses: actions/checkout@v5

      # The same setup `test` and `e2e` use. No Playwright browser (the smoke test drives the
      # packaged binary, not Chromium) and no Xvfb here — the Linux leg needs a display AND the
      # runtime libraries the packaged app links against, which is its own step below.
      - uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}
          wasm-pack-version: ${{ env.WASM_PACK_VERSION }}

      # The smoke test launches the packaged binary, so this leg needs the same runtime libraries and
      # display the `test` leg does. `libasound2t64` is the 24.04 name (§12.2 / the t64 rename).
      - name: Linux runtime deps + Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libgtk-3-0 libnss3 libasound2t64
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Xvfb never came up on :99" >&2
          exit 1

      - name: pnpm wasm
        run: pnpm wasm

      - name: Icons must be present (never ship the stock Electron logo)
        shell: bash
        run: bash scripts/ensure-icons.sh

      - name: pnpm build
        run: pnpm -r --if-present run build

      # `scripts/electron-builder.sh` owns `--publish never` (load-bearing: electron-builder reads
      # `CI=true` as consent to publish and otherwise fails with `⨯ GitHub Personal Access Token is
      # not set` after building everything) and the macOS signing conditional.
      #
      # NO SIGNING SECRETS HERE, deliberately: this workflow runs on every push to `main` and must
      # work identically in a fork. The script sees no `CSC_LINK` and builds unsigned — which also
      # means this is the leg that keeps the *unsigned* path honest, since release.yml only ever
      # exercises the signed one.
      - name: electron-builder ${{ matrix.builder }}
        shell: bash
        run: bash scripts/electron-builder.sh ${{ matrix.builder }}

      # §12.1: "launch the packaged binary with a CLI arg pointing at a fixture and assert it exits 0
      # after rendering one frame." That is `scripts/smoke-artefact.mjs`.
      # `TETRAVOX_SOFTWARE_GL=1`: hosted runners have no GPU, and the packaged app's GPU process dies
      # on them — Linux under Xvfb exits it "due to errors during initialization" and the hosted Intel
      # macOS image fails `GLDisplayEGL::Initialize`, after which every shader returns
      # "failed to compile: (no log)" and the job writes no frame. `src/main/index.ts` reads this
      # variable and adds `--disable-gpu`, the same thing `e2e/fixtures.ts` already does on Linux, so
      # the render happens in SwiftShader in-process. What the leg proves is unchanged: the packaged
      # binary starts, loads the fixtures and writes a real PNG.
      - name: Artefact smoke test
        shell: bash
        run: node scripts/smoke-artefact.mjs ${{ matrix.smoke }}

      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tetravox-ci-${{ matrix.os }}
          path: ${{ matrix.artefacts }}
          if-no-files-found: error
          retention-days: 7
